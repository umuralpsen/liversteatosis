project:
  name: liver-steatosis-detection
  seed: 42
  device: auto

paths:
  slides: data
  patches: dataset/patches
  labels: dataset/labels
  results: results
  manifest: data/manifest.yaml

extraction:
  target_mpp: 0.5
  patch_size: 256
  step_size: 256
  tissue_percentile: 5
  tissue_gray_max: 235

blobs:
  area_um2_min: 3.1
  area_um2_max: 125.0
  circularity_min: 0.6
  gray_percentile: 95
  morph_kernel_size: 3
  morph_iterations: 2
  stain_normalization: false

labeling:
  blob_threshold: 5

ablation:
  thresholds: [3, 5, 7, 10, 15, 20, 25, 30]

training:
  architecture: resnet18
  pretrained: true
  num_classes: 2
  input_size: 224
  batch_size: 32
  epochs: 10
  learning_rate: 0.0001
  patience_early_stop: 3
  patience_lr_scheduler: 3
  lr_scheduler_factor: 0.5
  use_weighted_sampler: true
  num_workers: 4

augmentation:
  horizontal_flip: true
  vertical_flip: true
  rotation_degrees: 15
  color_jitter_brightness: 0.15
  color_jitter_contrast: 0.15
  color_jitter_saturation: 0.1
  color_jitter_hue: 0.05
  affine_translate: 0.05

evaluation:
  bootstrap_samples: 2000
  confidence_level: 0.95

gradcam:
  alpha: 0.4
  colormap: jet
