[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blobcount"
version = "0.1.0"
description = "Liver steatosis detection: slide patching, blob counting, and histopathology classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "PyYAML>=6.0",
    "Pillow>=9.0",
    "opencv-python>=4.7",
    "matplotlib>=3.7",
    "openslide-python>=1.3",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["blobcount"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "-q"
