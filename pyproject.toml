[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blobcount"
version = "0.1.0"
description = "Liver steatosis detection: slide patching, blob counting, and histopathology classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "PyYAML>=6.0",
    "Pillow>=9.0",
    "opencv-python>=4.7",
    "matplotlib>=3.7",
    "openslide-python>=1.4.3",
    # pandas is pinned and pyarrow declared rather than transitive: measured on
    # Windows (Task 12), `import torch` followed by `import sklearn.metrics`
    # faults in the pyarrow C extension, `tests/conftest.py` preloads sklearn
    # to avoid it, and an unpinned pandas can pull an ABI-incompatible build
    # against the installed pyarrow — the same fault by another route. Both
    # lines make the preload supportable on a declared dependency.
    "pandas>=2.2.3,<3",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["blobcount"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "-q"
